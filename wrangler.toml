name = "stock-news-line"
main = "worker.js"
compatibility_date = "2026-09-01"

# UTC. Once a day to save LINE push quota: 12:30 UTC = 19:30 Bangkok (before US open)
[triggers]
crons = ["30 12 * * *"]

# id is filled in after `wrangler kv namespace create KV`
[[kv_namespaces]]
binding = "KV"
id = "42958c2b4eda4c638af004c95fa7c29a"

# keep Worker logs so past failures can be inspected in the dashboard
[observability]
enabled = true
